version: "3"
services:

  mysql:
    image: mysql:8.0
    container_name: argus_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Argustester666666
      MYSQL_DATABASE: argus
    networks:
      argus_net:
        aliases:
          - argus_mysql

  redis:
    image: redis
    container_name: argus_redis
    command: redis-server --requirepass 123456
    restart: always
    environment:
      - TZ=Asia/Shanghai
    networks:
      argus_net:
        aliases:
          - argus_redis

  argus:
    build:
      context: ../
      dockerfile: ops/dockerfile
      args:
        buildno: 1
    container_name: argus_server
    ports:
      - "7777:7777"
    restart: always
    environment:
      - TZ=Asia/Shanghai
    networks:
      argus_net:
        aliases:
        - argus_server
    volumes:
      - ./dev.env.ops:/argus/conf/dev.env
      - ../statics/knowledge:/argus/statics/knowledge
      - ../ui_runner:/argus/ui_runner

  ui_runner:
    build:
      context: ../ui_runner
      dockerfile: Dockerfile
    container_name: argus_ui_runner
    restart: always
    depends_on:
      - argus
    environment:
      - TZ=Asia/Shanghai
      - UI_RUNNER_SERVER=http://argus_server:7777
      - UI_RUNNER_BROWSER=chromium
      - UI_RUNNER_HEADLESS=true
    networks:
      argus_net:
        aliases:
          - argus_ui_runner
    volumes:
      - ../ui_runner:/app

networks:
  argus_net:
